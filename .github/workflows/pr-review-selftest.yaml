name: Code Oracle Self-Test

on:
  pull_request:
    paths:
      - ".github/pr-review/**"
      - ".github/workflows/pr-coding-standards-review.yaml"
      - ".github/workflows/pr-review-selftest.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test review kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -m unittest discover -s .github/pr-review/tests -v

      - name: Validate examples against real PR diffs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/pr-review/pr_evals.py validate \
            --examples-dir .github/pr-review/examples \
            --online
